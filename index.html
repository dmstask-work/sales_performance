            <text x="445" y="178" font-size="9.5" fill="#94a3b8" text-anchor="middle" id="axisMaxVal">270</text>

    let currentSales = 'All Sales';

    function switchTab(tab) {
      currentTab = tab;
      const btnSrc = document.getElementById('btnSrc');
      const btnKat = document.getElementById('btnKat');
      const combinedTitle = document.getElementById('combinedTitle');
      const legendText = document.getElementById('legendText');

      if (tab === 'source') {
        btnSrc.className = 'px-2.5 py-1 rounded bg-white shadow-xs text-blue-600 font-bold transition';
        btnKat.className = 'px-2.5 py-1 rounded text-slate-500 hover:text-slate-800 transition';

        legendText.textContent = 'Source Revenue (Rp Juta)';
      } else {
        btnKat.className = 'px-2.5 py-1 rounded bg-white shadow-xs text-blue-600 font-bold transition';
        btnSrc.className = 'px-2.5 py-1 rounded text-slate-500 hover:text-slate-800 transition';
        combinedTitle.textContent = 'Top 5 Kategori by Revenue (Rp Juta)';
        legendText.textContent = 'Kategori Revenue (Rp Juta)';
      }
      renderCombinedBars();
    }

    function renderCombinedBars() {
      const d = data[currentSales];
      const items = (currentTab === 'source') ? d.sources : d.kategori;
      
      const maxVal = Math.max(...items.map(x => x.val));
      let axisMax = 270;
      if (maxVal <= 35) axisMax = 40;
      else if (maxVal <= 65) axisMax = 70;
      else if (maxVal <= 110) axisMax = 120;
      else if (maxVal <= 150) axisMax = 160;
      else axisMax = 270;

      document.getElementById('axisMidVal').textContent = Math.round(axisMax / 2);
      document.getElementById('axisMaxVal').textContent = axisMax;

      const group = document.getElementById('barsGroup');
      group.innerHTML = '';

      const startX = 125;
      const totalWidth = 320;
      const barHeight = 17;
      const gap = 11;
      const startY = 20;

      items.forEach((item, idx) => {
        const y = startY + idx * (barHeight + gap);
        const w = (item.val / axisMax) * totalWidth;

        // Label on left
        const textLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        textLabel.setAttribute('x', startX - 8);
        textLabel.setAttribute('y', y + 12);
        textLabel.setAttribute('font-size', '9.5');
        textLabel.setAttribute('fill', '#475569');
        textLabel.setAttribute('text-anchor', 'end');
        textLabel.textContent = item.name;
        group.appendChild(textLabel);

        // Bar rect (Clean sky-blue #38bdf8 with rounded corners)
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', startX);
        rect.setAttribute('y', y);
        rect.setAttribute('width', Math.max(w, 3));
        rect.setAttribute('height', barHeight);
        rect.setAttribute('rx', '3');
        rect.setAttribute('fill', '#38bdf8');
        group.appendChild(rect);

        // Value text at end of bar: e.g. "226.4 (50%)"
        const textVal = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        textVal.setAttribute('x', startX + w + 8);
        textVal.setAttribute('y', y + 12);
        textVal.setAttribute('font-size', '9.5');
        textVal.setAttribute('font-weight', 'bold');
        textVal.setAttribute('fill', '#0f172a');
        textVal.textContent = item.val + ' (' + item.pct + ')';
        group.appendChild(textVal);
      });
    }

    function updateDashboard(salesName) {
      currentSales = salesName;
      const d = data[salesName];

      // Update 4 Cards
      document.getElementById('cardRevenue').textContent = d.revenue_str;
      document.getElementById('cardSesi').textContent = d.sesi;
      document.getElementById('cardTarget').textContent = d.target_str;
      document.getElementById('cardPct').textContent = d.pct_str;

      const cardPct = document.getElementById('cardPct');
      if (parseFloat(d.pct_str) >= 100) {
        cardPct.className = 'text-2xl md:text-3xl font-bold text-emerald-600 tracking-tight';
      } else {
        cardPct.className = 'text-2xl md:text-3xl font-bold text-amber-700 tracking-tight';
      }

      // Update Trend SVG Line Chart
      const revs = d.monthly_rev;
      const maxRev = Math.max(...revs, d.goal_num);
      const topY = Math.ceil((maxRev * 1.25) / 10) * 10;

      document.getElementById('yAxisTop').textContent = topY;
      document.getElementById('yAxisMid').textContent = Math.round(topY * 0.6);
      document.getElementById('yAxisLow').textContent = Math.round(topY * 0.3);

      function getY(val) {
        const minYPos = 170;
        const maxYPos = 30;
        return minYPos - (val / topY) * (minYPos - maxYPos);
      }

      const y1 = getY(revs[0]);
      const y2 = getY(revs[1]);
      const y3 = getY(revs[2]);
      const yGoal = getY(d.goal_num);

      document.getElementById('trendPath').setAttribute('d', `M 120 ${y1} L 265 ${y2} L 410 ${y3}`);
      document.getElementById('point1').setAttribute('cy', y1);
      document.getElementById('point2').setAttribute('cy', y2);
      document.getElementById('point3').setAttribute('cy', y3);

      const l1 = document.getElementById('label1');
      l1.setAttribute('y', y1 - 9);
      l1.textContent = revs[0].toFixed(1) + ' jt';

      const l2 = document.getElementById('label2');
      l2.setAttribute('y', y2 - 9);
      l2.textContent = revs[1].toFixed(1) + ' jt';

      const l3 = document.getElementById('label3');
      l3.setAttribute('y', y3 - 9);
      l3.textContent = revs[2].toFixed(1) + ' jt';

      const goalLine = document.getElementById('goalLine');
      goalLine.setAttribute('y1', yGoal);
      goalLine.setAttribute('y2', yGoal);
      const goalText = document.getElementById('goalText');
      goalText.setAttribute('y', yGoal - 6);
      goalText.textContent = `Target: ${d.goal_num} jt`;

      // Update Combined Bar Chart
      renderCombinedBars();
    }

    // Initialize
    updateDashboard('All Sales');
  </script>
</body>
</html>
